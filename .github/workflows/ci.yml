name: KYRO CI
on:
  push:
    branches: [main, kyro-vite-foundation]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=optional --no-package-lock
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) { const via=(v.via||[]).map(x=>typeof x==='string'?x:(x.title+' ['+x.range+'] '+(x.url||''))).join('; '); console.log(name + ' | ' + v.severity + ' | range=' + v.range + ' | via=' + via + ' | fix=' + JSON.stringify(v.fixAvailable)); }"
      - run: npm run build
